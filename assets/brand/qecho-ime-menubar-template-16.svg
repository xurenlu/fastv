<svg xmlns="http://www.w3.org/2000/svg" width="16pt" height="16pt" viewBox="1.5 1.5 13 13" role="img" aria-label="QEcho IME menu bar template icon">
  <!--
    输入源菜单/菜单栏模板图，16×16pt 画布（对齐系统 CVIconTemplate 量级）。
    纯黑不透明 + 透明背景，macOS 按明暗主题自动反色。
    图形为脉冲外环 + 麦克风主体（声波竖条 even-odd 镂空）+ U 形托架 + 底座，
    坐标由 1024 版按 ÷64 缩放而来。
    viewBox 裁掉四周留白（图形实际范围 1.75–14.25），使图形占画布 ~88%，
    与菜单里其它输入法图标的视觉尺寸对齐；否则渲染出来明显小一圈。
  -->

  <!-- 脉冲外环：描边 + dash 缺口 -->
  <circle cx="8" cy="8" r="5.75" fill="none" stroke="#000000"
          stroke-width="1" stroke-dasharray="7.6 1.6" stroke-linecap="butt"
          transform="rotate(-46 8 8)"/>

  <!-- 麦克风主体（胶囊）+ even-odd 镂空 5 根声波竖条 -->
  <path fill="#000000" fill-rule="evenodd" d="
    M6.4 6.75
    a1.6 1.6 0 0 1 3.2 0
    v1.5
    a1.6 1.6 0 0 1 -3.2 0
    Z
    M7.06 7.6 a0.2 0.2 0 0 1 0.4 0 v0.8 a0.2 0.2 0 0 1 -0.4 0 Z
    M7.6 7.1 a0.2 0.2 0 0 1 0.4 0 v1.8 a0.2 0.2 0 0 1 -0.4 0 Z
    M8.13 6.7 a0.2 0.2 0 0 1 0.4 0 v2.6 a0.2 0.2 0 0 1 -0.4 0 Z
    M8.66 7.1 a0.2 0.2 0 0 1 0.4 0 v1.8 a0.2 0.2 0 0 1 -0.4 0 Z
    M9.2 7.6 a0.2 0.2 0 0 1 0.4 0 v0.8 a0.2 0.2 0 0 1 -0.4 0 Z"/>

  <!-- U 形托架 -->
  <path d="M5.56 8 v0.84 c0 1.34 1.1 2.44 2.44 2.44 s2.44 -1.1 2.44 -2.44 v-0.84"
        fill="none" stroke="#000000" stroke-width="0.7" stroke-linecap="butt"/>

  <!-- 支架竖杆 + 底座 -->
  <rect x="7.63" y="10.84" width="0.75" height="1.62" rx="0.1" fill="#000000"/>
  <rect x="6.8" y="12.4" width="2.4" height="0.62" rx="0.12" fill="#000000"/>
</svg>
