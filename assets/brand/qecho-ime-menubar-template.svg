<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="QEcho IME menu bar template icon">
  <!--
    菜单栏输入源模板图（monochrome template image）。
    规范：纯黑不透明形状 + 透明背景，macOS 按明暗主题自动反色，白色不可用（会露白块）。
    构图：一圈带缺口的脉冲外环 + 麦克风主体（内嵌声波竖条以镂空实现）+ U 形托架 + 底座。
    线条按 16pt 小尺寸加粗，保证菜单栏可辨识。
  -->

  <!-- 脉冲外环：描边 + dash 缺口，营造声波分段感 -->
  <circle cx="512" cy="512" r="368" fill="none" stroke="#000000"
          stroke-width="64" stroke-dasharray="486 104" stroke-linecap="butt"
          transform="rotate(-46 512 512)"/>

  <!-- 麦克风主体（胶囊），用 even-odd 把 5 根声波竖条镂空出来 -->
  <path fill="#000000" fill-rule="evenodd" d="
    M410 432
    a102 102 0 0 1 204 0
    v96
    a102 102 0 0 1 -204 0
    Z
    M452 486 a13 13 0 0 1 26 0 v52 a13 13 0 0 1 -26 0 Z
    M486 456 a13 13 0 0 1 26 0 v112 a13 13 0 0 1 -26 0 Z
    M520 430 a13 13 0 0 1 26 0 v164 a13 13 0 0 1 -26 0 Z
    M554 456 a13 13 0 0 1 26 0 v112 a13 13 0 0 1 -26 0 Z
    M588 486 a13 13 0 0 1 26 0 v52 a13 13 0 0 1 -26 0 Z"/>

  <!-- U 形托架 -->
  <path d="M356 512v54c0 86 70 156 156 156s156-70 156-156v-54"
        fill="none" stroke="#000000" stroke-width="44" stroke-linecap="butt"/>

  <!-- 支架竖杆 + 底座 -->
  <rect x="488" y="694" width="48" height="104" rx="6" fill="#000000"/>
  <rect x="436" y="792" width="152" height="40" rx="8" fill="#000000"/>
</svg>
