<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>面试准备</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      background: #0f0f1a;
      background-image: 
        radial-gradient(ellipse at 20% 20%, rgba(120, 80, 255, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(255, 100, 150, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 50%, rgba(60, 180, 255, 0.08) 0%, transparent 60%);
      padding: 40px 20px;
    }
    
    .container {
      max-width: 720px;
      margin: 0 auto;
    }
    
    /* Header */
    .header {
      text-align: center;
      margin-bottom: 48px;
    }
    
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      box-shadow: 
        0 20px 40px rgba(124, 58, 237, 0.3),
        0 0 60px rgba(124, 58, 237, 0.2);
      animation: float 3s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    
    .header h1 {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    
    .header p {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.5);
    }
    
    /* Card */
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 32px;
      backdrop-filter: blur(20px);
      margin-bottom: 24px;
    }
    
    .input-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 16px;
    }
    
    .input-label .icon {
      width: 32px;
      height: 32px;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }
    
    textarea {
      width: 100%;
      min-height: 180px;
      padding: 20px;
      font-family: inherit;
      font-size: 15px;
      line-height: 1.7;
      color: #fff;
      background: rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      resize: vertical;
      transition: all 0.3s ease;
    }
    
    textarea:focus {
      outline: none;
      border-color: #7c3aed;
      background: rgba(0, 0, 0, 0.4);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.15);
    }
    
    textarea::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }
    
    /* Quick Tags */
    .quick-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
    }
    
    .tag {
      padding: 8px 16px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.6);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .tag:hover {
      color: #fff;
      background: rgba(124, 58, 237, 0.2);
      border-color: rgba(124, 58, 237, 0.4);
    }
    
    /* Button */
    .btn-generate {
      width: 100%;
      padding: 18px 32px;
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #7c3aed 0%, #ec4899 100%);
      border: none;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 24px rgba(124, 58, 237, 0.3);
    }
    
    .btn-generate:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 12px 32px rgba(124, 58, 237, 0.4);
    }
    
    .btn-generate:active:not(:disabled) {
      transform: translateY(0);
    }
    
    .btn-generate:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .btn-generate .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    /* Result */
    .result-section {
      display: none;
    }
    
    .result-section.show {
      display: block;
      animation: slideUp 0.4s ease;
    }
    
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .result-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    
    .result-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }
    
    .result-title .icon {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    
    .btn-copy {
      padding: 10px 20px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    
    .btn-copy:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    
    .result-content {
      padding: 24px;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: rgba(255, 255, 255, 0.85);
      font-size: 15px;
      line-height: 1.9;
      white-space: pre-wrap;
      word-wrap: break-word;
      max-height: 600px;
      overflow-y: auto;
    }
    
    .result-content::-webkit-scrollbar {
      width: 6px;
    }
    
    .result-content::-webkit-scrollbar-track {
      background: transparent;
    }
    
    .result-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 3px;
    }
    
    /* Footer */
    .footer {
      text-align: center;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .footer p {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.3);
    }
    
    /* Responsive */
    @media (max-width: 640px) {
      body {
        padding: 20px 16px;
      }
      
      .header h1 {
        font-size: 28px;
      }
      
      .card {
        padding: 24px;
      }
      
      .logo {
        width: 64px;
        height: 64px;
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">💼</div>
      <h1>面试准备助手</h1>
      <p>输入目标岗位，AI 为你定制专属面试攻略</p>
    </header>
    
    <div class="card">
      <div class="input-label">
        <span class="icon">📋</span>
        <span>岗位信息</span>
      </div>
      <textarea id="text-input" placeholder="请描述你的目标岗位...

例如：
• 岗位名称：高级前端工程师
• 目标公司：字节跳动
• 工作年限：3-5年
• 技术要求：React、TypeScript、性能优化
• 其他要求：有大型项目经验，良好的沟通能力"></textarea>
      
      <div class="quick-tags">
        <span class="tag" data-value="前端工程师">前端工程师</span>
        <span class="tag" data-value="后端工程师">后端工程师</span>
        <span class="tag" data-value="产品经理">产品经理</span>
        <span class="tag" data-value="UI设计师">UI设计师</span>
        <span class="tag" data-value="数据分析师">数据分析师</span>
      </div>
    </div>
    
    <button id="process-btn" class="btn-generate">
      <span class="btn-text">✨ 生成面试攻略</span>
    </button>
    
    <div id="result-section" class="result-section">
      <div class="card">
        <div class="result-header">
          <div class="result-title">
            <span class="icon">📝</span>
            <span>面试准备材料</span>
          </div>
          <button id="copy-btn" class="btn-copy">📋 复制内容</button>
        </div>
        <div id="result" class="result-content"></div>
      </div>
    </div>
    
    <footer class="footer">
      <p>Powered by AI · v1.2.0</p>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
