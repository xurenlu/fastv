<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名片识别助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>💼 名片识别助手</h1>
      <p class="subtitle">拍照名片，提取联系人信息并整理成结构化数据</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择名片图片</p>
          <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">图片将自动上传到云存储</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择名片图片</button>
        <button id="extract-btn" class="btn btn-secondary" disabled>提取信息</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="info-section" style="display:none;">
        <div id="info-content" class="info-content"></div>
        <div class="action-buttons">
          <button id="copy-all-btn" class="btn btn-primary">复制全部信息</button>
          <button id="copy-name-btn" class="btn btn-secondary">复制姓名</button>
          <button id="copy-phone-btn" class="btn btn-secondary">复制电话</button>
          <button id="copy-email-btn" class="btn btn-secondary">复制邮箱</button>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
