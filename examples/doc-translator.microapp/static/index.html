<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文档翻译助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>📄 文档翻译助手</h1>
      <p class="subtitle">上传文档截图，自动识别文字并翻译成目标语言</p>
      
      <div class="language-selector">
        <label for="target-lang">目标语言：</label>
        <select id="target-lang">
          <option value="中文">中文</option>
          <option value="英文">英文</option>
          <option value="日文">日文</option>
          <option value="韩文">韩文</option>
          <option value="法文">法文</option>
          <option value="德文">德文</option>
          <option value="西班牙文">西班牙文</option>
        </select>
      </div>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择文档图片</p>
          <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">图片将自动上传到云存储</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择文档图片</button>
        <button id="translate-btn" class="btn btn-secondary" disabled>识别并翻译</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="translation-section" style="display:none;">
        <div id="translation-content" class="translation-content"></div>
        <button id="copy-btn" class="btn btn-primary">复制翻译结果</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
