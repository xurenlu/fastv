<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>穿搭顾问</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>👔 穿搭顾问</h1>
      <p class="subtitle">上传穿搭照片，获取专业的风格分析和搭配建议</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择穿搭图片</p>
          <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">图片将自动上传到云存储</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择穿搭图片</button>
        <button id="analyze-btn" class="btn btn-secondary" disabled>分析穿搭</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="advice-section" style="display:none;">
        <button id="advice-btn" class="btn btn-primary">获取搭配建议</button>
        <div id="advice-content" class="advice-content"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
