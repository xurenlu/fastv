<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>作文批改</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>✍️ 作文批改</h1>
      <p class="subtitle">拍照上传作文，AI 自动识别并给出评分和修改建议</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择作文图片</p>
          <p style="font-size: 12px; color: #86868b; margin-top: 8px;">图片将自动上传</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择作文图片</button>
        <button id="grade-btn" class="btn btn-secondary" disabled>开始批改</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="suggestions-section" style="display:none;">
        <button id="suggestions-btn" class="btn btn-primary">获取修改建议</button>
        <div id="suggestions-content" class="suggestions-content"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
