<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微商营销助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>🛍️ 微商营销助手</h1>
      <p class="subtitle">上传商品图片，生成营销文案和客户回复话术</p>
      
      <div class="product-info">
        <div class="form-row">
          <div class="form-group">
            <label for="product-name">商品名称：</label>
            <input type="text" id="product-name" placeholder="如：新款蓝牙耳机">
          </div>
          <div class="form-group">
            <label for="product-price">价格：</label>
            <input type="text" id="product-price" placeholder="如：299元">
          </div>
        </div>
        <div class="form-group">
          <label for="product-features">商品特点（可选）：</label>
          <textarea id="product-features" placeholder="如：降噪、长续航、高音质..."></textarea>
        </div>
      </div>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择商品图片</p>
          <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">支持多张图片，可多次上传</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择商品图片</button>
        <button id="generate-btn" class="btn btn-secondary" disabled>生成营销文案</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="marketing-section" style="display:none;">
        <div id="marketing-content" class="marketing-content"></div>
        <div class="action-buttons">
          <button id="copy-btn" class="btn btn-primary">复制文案</button>
          <button id="reply-btn" class="btn btn-secondary">生成回复话术</button>
        </div>
        <div id="reply-content" class="reply-content"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
