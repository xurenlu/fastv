<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>美食识别助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>🍽️ 美食识别助手</h1>
      <p class="subtitle">拍照识别美食，获取营养成分和健康建议</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择美食图片</p>
          <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">图片将自动上传到云存储</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择美食图片</button>
        <button id="recognize-btn" class="btn btn-secondary" disabled>识别美食</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="nutrition-section" style="display:none;">
        <button id="nutrition-btn" class="btn btn-primary">获取营养分析</button>
        <div id="nutrition-info" class="nutrition-info"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
