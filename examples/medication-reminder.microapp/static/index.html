<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>用药提醒</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>用药提醒</h1>
      <p class="subtitle">拍照药盒，识别药品并设置提醒</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择图片</p>
          <p style="font-size: 12px; color: #86868b; margin-top: 8px;">图片将自动上传</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择图片</button>
        <button id="process-btn" class="btn btn-secondary" disabled>开始处理</button>
      </div>
      
      <div id="result" class="result"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
