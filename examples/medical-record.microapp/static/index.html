<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>病历识别助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>🏥 病历识别助手</h1>
      <p class="subtitle">上传病历或检查报告，智能识别并整理关键信息</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📋</div>
          <p>点击下方按钮选择病历或检查报告图片</p>
          <p style="font-size: 12px; color: #a0aec0; margin-top: 8px;">支持病历、化验单、影像报告等</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择病历图片</button>
        <button id="analyze-btn" class="btn btn-secondary" disabled>识别分析</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="analysis-section" style="display:none;">
        <div id="analysis-content" class="analysis-content"></div>
        <button id="summary-btn" class="btn btn-primary">生成病历摘要</button>
        <div id="summary-content" class="summary-content"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
