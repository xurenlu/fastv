<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>错题本整理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>📚 错题本整理</h1>
      <p class="subtitle">拍照上传错题，自动分类整理并生成个性化复习计划</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择错题图片</p>
          <p style="font-size: 12px; color: #86868b; margin-top: 8px;">图片将自动上传</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择错题图片</button>
        <button id="analyze-btn" class="btn btn-secondary" disabled>分析错题</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="plan-section" style="display:none;">
        <button id="plan-btn" class="btn btn-primary">生成复习计划</button>
        <div id="plan-content" class="plan-content"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
