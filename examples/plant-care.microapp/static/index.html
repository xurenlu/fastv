<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>植物养护助手</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <h1>🌱 植物养护助手</h1>
      <p class="subtitle">上传植物照片，获取专业的识别和养护建议</p>
      
      <div id="image-container" class="image-container">
        <img id="preview" src="" alt="预览" style="display:none;">
        <div id="placeholder" class="placeholder">
          <div class="placeholder-icon">📷</div>
          <p>点击下方按钮选择植物图片</p>
        </div>
      </div>
      
      <div class="actions">
        <button id="pick-btn" class="btn btn-primary">选择植物图片</button>
        <button id="recognize-btn" class="btn btn-secondary" disabled>识别植物</button>
      </div>
      
      <div id="result" class="result"></div>
      
      <div id="care-section" style="display:none;">
        <button id="care-btn" class="btn btn-primary">获取养护建议</button>
        <div id="care-tips" class="care-tips"></div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
