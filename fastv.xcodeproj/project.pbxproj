		5C0423AD2ECD793000821B50 /* Sign ONNX Runtime Library */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
				"$(BUILT_PRODUCTS_DIR)/$(FRAMEWORKS_FOLDER_PATH)/libonnxruntime.1.23.2.dylib",
			);
			name = "Sign ONNX Runtime Library";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/sh;
			shellScript = "# 在应用签名之前，使用与项目配置相同的签名身份签名库文件\nLIB_PATH=\"${BUILT_PRODUCTS_DIR}/${FRAMEWORKS_FOLDER_PATH}/libonnxruntime.1.23.2.dylib\"\n\nif [ ! -f \"${LIB_PATH}\" ]; then\n    echo \"⚠️  库文件不存在: ${LIB_PATH}\"\n    exit 0\nfi\n\n# 确定签名身份\nSIGN_IDENTITY=\"\"\n\n# 优先使用 EXPANDED_CODE_SIGN_IDENTITY（如果可用，这是 Xcode 选择的完整签名身份）\nif [ -n \"${EXPANDED_CODE_SIGN_IDENTITY}\" ] && [ \"${EXPANDED_CODE_SIGN_IDENTITY}\" != \"-\" ]; then\n    # 如果是哈希值，查找对应的证书名称\n    if echo \"${EXPANDED_CODE_SIGN_IDENTITY}\" | grep -qE '^[0-9A-F]{40}$'; then\n        SIGN_IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | grep \"${EXPANDED_CODE_SIGN_IDENTITY}\" | sed 's/.*\"\\(.*\\)\".*/\\1/' || echo \"\")\n        if [ -n \"${SIGN_IDENTITY}\" ]; then\n            echo \"🔍 使用 EXPANDED_CODE_SIGN_IDENTITY 对应的证书: ${SIGN_IDENTITY}\"\n        fi\n    else\n        SIGN_IDENTITY=\"${EXPANDED_CODE_SIGN_IDENTITY}\"\n        echo \"🔍 使用 EXPANDED_CODE_SIGN_IDENTITY: ${SIGN_IDENTITY}\"\n    fi\n# 否则使用 DEVELOPMENT_TEAM 查找匹配的证书\nelif [ -n \"${DEVELOPMENT_TEAM}\" ]; then\n    # 查找所有证书，然后通过临时签名来检查 Team ID\n    ALL_CERTS=$(security find-identity -v -p codesigning 2>/dev/null | grep -E \"Apple Development|Developer ID\")\n    TEMP_FILE=\"/tmp/test_sign_$$.dylib\"\n    touch \"${TEMP_FILE}\"\n    \n    echo \"${ALL_CERTS}\" | while IFS= read -r cert_line; do\n        cert_hash=$(echo \"${cert_line}\" | sed -n 's/^[[:space:]]*[0-9]*)[[:space:]]*\\([0-9A-F]*\\).*/\\1/p')\n        cert_name=$(echo \"${cert_line}\" | sed -n 's/.*\"\\(.*\\)\".*/\\1/p')\n        if [ -n \"${cert_hash}\" ] && [ -n \"${cert_name}\" ]; then\n            # 尝试使用此证书签名临时文件，然后检查 Team ID\n            if codesign --force --sign \"${cert_hash}\" \"${TEMP_FILE}\" 2>/dev/null; then\n                cert_team=$(codesign -dvv \"${TEMP_FILE}\" 2>&1 | grep \"TeamIdentifier=\" | sed 's/.*TeamIdentifier=\\([^ ]*\\).*/\\1/' || echo \"\")\n                codesign --remove-signature \"${TEMP_FILE}\" 2>/dev/null || true\n                \n                if [ \"${cert_team}\" = \"${DEVELOPMENT_TEAM}\" ]; then\n                    SIGN_IDENTITY=\"${cert_name}\"\n                    echo \"🔍 找到匹配 Team ID ${DEVELOPMENT_TEAM} 的证书: ${SIGN_IDENTITY}\"\n                    break\n                fi\n            fi\n        fi\n    done\n    \n    rm -f \"${TEMP_FILE}\"\nfi\n\n# 如果找不到，尝试使用 CODE_SIGN_IDENTITY（但可能不完整）\nif [ -z \"${SIGN_IDENTITY}\" ] && [ -n \"${CODE_SIGN_IDENTITY}\" ] && [ \"${CODE_SIGN_IDENTITY}\" != \"-\" ]; then\n    # 如果 CODE_SIGN_IDENTITY 包含完整名称，直接使用\n    if echo \"${CODE_SIGN_IDENTITY}\" | grep -q \":\"; then\n        SIGN_IDENTITY=\"${CODE_SIGN_IDENTITY}\"\n        echo \"🔍 使用 CODE_SIGN_IDENTITY: ${SIGN_IDENTITY}\"\n    else\n        # 否则尝试查找完整的签名身份\n        SIGN_IDENTITY=$(security find-identity -v -p codesigning 2>/dev/null | grep \"${CODE_SIGN_IDENTITY}\" | grep -E \"Apple Development|Developer ID\" | head -1 | sed 's/.*\"\\(.*\\)\".*/\\1/' || echo \"\")\n        if [ -n \"${SIGN_IDENTITY}\" ]; then\n            echo \"🔍 找到完整签名证书: ${SIGN_IDENTITY}\"\n        fi\n    fi\nfi\n\n# 如果找不到签名身份，使用 ad-hoc 签名\nif [ -z \"${SIGN_IDENTITY}\" ]; then\n    SIGN_IDENTITY=\"-\"\n    echo \"⚠️  未找到签名证书，使用 ad-hoc 签名（仅开发）\"\nfi\n\n# 移除库文件的旧签名\necho \"🔧 移除库文件旧签名...\"\ncodesign --remove-signature \"${LIB_PATH}\" 2>/dev/null || true\n\n# 使用相同的签名重新签名库文件\necho \"🔧 使用 ${SIGN_IDENTITY} 签名库文件...\"\nSIGN_SUCCESS=false\n\n# 尝试签名（不使用 --options runtime，因为开发证书可能不支持）\nif codesign --force --sign \"${SIGN_IDENTITY}\" --timestamp=none \"${LIB_PATH}\" 2>&1; then\n    SIGN_SUCCESS=true\n    echo \"✅ 库文件签名成功\"\nelse\n    # 如果失败，尝试 ad-hoc 签名\n    echo \"⚠️  签名失败，尝试 ad-hoc 签名...\"\n    if codesign --force --sign - --timestamp=none \"${LIB_PATH}\" 2>&1; then\n        SIGN_SUCCESS=true\n        echo \"✅ 库文件使用 ad-hoc 签名成功\"\n    fi\nfi\n\n# 验证签名\nif [ \"${SIGN_SUCCESS}\" = true ]; then\n    if codesign -v \"${LIB_PATH}\" 2>/dev/null; then\n        LIB_TEAM=$(codesign -dvv \"${LIB_PATH}\" 2>&1 | grep \"TeamIdentifier=\" | sed 's/.*TeamIdentifier=\\([^ ]*\\).*/\\1/' || echo \"\")\n        if [ -n \"${LIB_TEAM}\" ]; then\n            echo \"✅ 库文件签名完成，Team ID: ${LIB_TEAM}\"\n        else\n            echo \"✅ 库文件签名完成（ad-hoc）\"\n        fi\n    else\n        echo \"⚠️  库文件签名验证失败\"\n        exit 1\n    fi\nelse\n    echo \"❌ 库文件签名失败\"\n    exit 1\nfi\n";
		};
